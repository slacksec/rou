<!doctype html><html><head><meta charset="utf-8"><title>Reset test achievement</title></head><body><button id="reset">Remove free Sans achievement</button><p id="result"></p><a href="next.html">Back to achievements</a><script>document.getElementById('reset').onclick=()=>{const achievements=JSON.parse(localStorage.getItem('rouAchievements')||'{}');delete achievements['sans-normal'];localStorage.setItem('rouAchievements',JSON.stringify(achievements));document.getElementById('result').textContent='Free Sans achievement removed. Other achievements preserved.';};</script></body></html>
