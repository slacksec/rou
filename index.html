<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hi</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #hi {
      font-size: 3rem;
      cursor: pointer;
      text-decoration: underline;
    }
    #hi:focus-visible {
      outline: 3px solid #f5b700;
      outline-offset: 8px;
      border-radius: 4px;
    }
    #achievementToast {
      position: fixed;
      top: 24px;
      left: 50%;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 270px;
      padding: 14px 20px;
      color: white;
      background: linear-gradient(135deg, #28231b, #111);
      border: 2px solid #f5b700;
      border-radius: 14px;
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.4), 0 0 22px rgba(245, 183, 0, 0.25);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -130%);
      transition: opacity 220ms ease, transform 350ms cubic-bezier(.2, .9, .3, 1.2);
    }
    #achievementToast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    #achievementToast .trophy {
      font-size: 2.3rem;
    }
    #achievementToast strong,
    #achievementToast span {
      display: block;
    }
    #achievementToast span {
      margin-bottom: 2px;
      color: #f5ce55;
      font-size: 0.76rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #nextBtn {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 1.2rem;
      padding: 12px 20px;
      z-index: 10;
      cursor: pointer;
    }
    /* 🎄 Christmas tree button top-right (invisible) */
    #tree {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 2.5rem;
      z-index: 999;
      cursor: pointer;
      user-select: none;
      opacity: 0;
    }
    /* 🎮 Dash button top-left */
    #dashBtn {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 2.5rem;
      z-index: 999;
      cursor: pointer;
      user-select: none;
    }
    /* ⭐ Matariki button top-middle */
    #matarikiBtn {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 4px 10px;
      border: 0;
      background: none;
      font-size: 2.5rem;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      filter: drop-shadow(0 0 8px rgba(255, 201, 61, 0.8));
      transition: transform 160ms ease, filter 160ms ease;
    }
    #matarikiBtn:hover,
    #matarikiBtn:focus-visible {
      transform: translateX(-50%) scale(1.18) rotate(8deg);
      filter: drop-shadow(0 0 14px rgba(255, 201, 61, 1));
      outline: none;
    }
    /* ⚙️ Settings button bottom-left */
    #settingsBtn {
      position: fixed;
      bottom: 10px;
      left: 10px;
      font-size: 2rem;
      z-index: 10;
      cursor: pointer;
      background: none;
      border: none;
      padding: 5px;
    }
    /* Settings modal */
    #settingsModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 50px rgba(0,0,0,0.5);
      z-index: 1000;
      min-width: 300px;
    }
    #settingsModal h2 {
      margin-top: 0;
      text-align: center;
    }
    #settingsModal button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #2196F3;
      color: white;
    }
    #settingsModal button:hover {
      background: #1976D2;
    }
    #settingsModal input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .closeSettings {
      background: #f44336 !important;
    }
    .closeSettings:hover {
      background: #d32f2f !important;
    }
    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 999;
    }
  </style>
</head>
<body>
  <div id="tree">🎄</div>
  <div id="dashBtn">🎮</div>
  <button id="matarikiBtn" type="button" aria-label="Open the Matariki page" title="Matariki">⭐</button>
<div id="hi" role="button" tabindex="0">Hi</div>

  <div id="achievementToast" role="status" aria-live="polite">
    <div class="trophy">🏆</div>
    <div><span>Achievement unlocked</span><strong id="achievementToastName">First Click</strong></div>
  </div>

  <button id="nextBtn" onclick="location.href='next.html'">N ⏩</button>
  <button id="settingsBtn">&#x2699;</button>

  <div id="overlay"></div>
  <div id="settingsModal">
    <h2>&#x2699; Settings</h2>
    <button id="uiSizeBtn">📏 UI Size</button>
    <button id="uselessBtn">🗑️ Useless Button</button>
    <button id="themeBtn">Extra stylish. ooh</button>
    <button id="soundBtn">🔊 Sound</button>
    <input type="password" id="ogPassword" placeholder="Enter Password">
    <button id="submitPassword">Enter</button>
    <button id="revertBtn" style="display: none; background: #FF9800;">🔄 Revert to Normal</button>
    <button class="closeSettings">❌ Close</button>
  </div>

  <footer style="position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 1rem;">
    Made with ❤️ by Calvin © 2025
  </footer>

  <script>
    // 🗿 April Fools moai spam
    const MOAI_MAX = 200;
    const BOOM_SRC = 'https://cdn.pixabay.com/download/audio/2025/08/29/audio_437b300d21.mp3?filename=bithuh-vine-boom-392646.mp3';
    let moaiCount = 0;
    let moaiInterval = null;

    const ACHIEVEMENT_KEY = 'rouAchievements';

    function getAchievements() {
      try {
        return JSON.parse(localStorage.getItem(ACHIEVEMENT_KEY)) || {};
      } catch (error) {
        return {};
      }
    }

    function unlockAchievement(id) {
      const achievements = getAchievements();
      if (achievements[id]) return false;
      achievements[id] = { unlockedAt: new Date().toISOString() };
      localStorage.setItem(ACHIEVEMENT_KEY, JSON.stringify(achievements));
      return true;
    }

    function showAchievementToast(name) {
      const toast = document.getElementById('achievementToast');
      document.getElementById('achievementToastName').textContent = name;
      toast.classList.remove('show');
      void toast.offsetWidth;
      toast.classList.add('show');
      window.setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function unlockWithPopup(id, name) {
      const isNew = unlockAchievement(id);
      if (isNew) showAchievementToast(name);
      return isNew;
    }

    function spawnMoai() {
      if (moaiCount >= MOAI_MAX) {
        clearInterval(moaiInterval);
        return;
      }
      const el = document.createElement('span');
      el.textContent = '🗿';
      el.style.cssText = `
        position: fixed;
        font-size: ${1.5 + Math.random() * 3.5}rem;
        left: ${Math.random() * 95}vw;
        top: ${Math.random() * 90}vh;
        z-index: ${500 + moaiCount};
        pointer-events: none;
        animation: moaiFade 0.3s ease-out;
      `;
      document.body.appendChild(el);
      const boom = new Audio(BOOM_SRC);
      boom.volume = Math.max(0.05, 0.4 - moaiCount * 0.0015);
      boom.play().catch(() => {});
      moaiCount++;
    }

    // Only run on April 1st
    const now = new Date();
    if (now.getMonth() === 3 && now.getDate() === 1) {
      const style = document.createElement('style');
      style.textContent = `@keyframes moaiFade { from { transform: scale(0) rotate(-20deg); opacity:0; } to { transform: scale(1) rotate(0deg); opacity:1; } }`;
      document.head.appendChild(style);
      moaiInterval = setInterval(spawnMoai, 180);
    }

    // Load OG mode state
    let isOGMode = localStorage.getItem('ogMode') === 'true';

    // Apply OG mode if enabled
    if (isOGMode) {
      document.getElementById('hi').textContent = 'Welcome, OG user!';
      updateRevertButton();
    }

    // Original rickroll function, now delayed long enough to celebrate the unlock.
    function originalHiClick() {
      const firstUnlock = unlockWithPopup('first-click', 'First Click');

      window.setTimeout(() => {
        document.body.innerHTML =
          '<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" allow="autoplay"></iframe>';
      }, firstUnlock ? 2500 : 0);
    }

    // Set Hi button behavior
    document.getElementById('hi').onclick = originalHiClick;
    document.getElementById('hi').onkeydown = (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        originalHiClick();
      }
    };

    // 🎮 Go to dash.html on click
    document.getElementById('dashBtn').onclick = () => {
      const isNew = unlockWithPopup('game-on', 'Game On');
      window.setTimeout(() => { location.href = 'dash.html'; }, isNew ? 2400 : 0);
    };

    // ⭐ Go to matariki.html on click
    document.getElementById('matarikiBtn').onclick = () => {
      const isNew = unlockWithPopup('star-gazer', 'Star Gazer');
      window.setTimeout(() => { location.href = 'matariki.html'; }, isNew ? 2400 : 0);
    };

    // ⭐ Go to matariki.html on click
    document.getElementById('matarikiBtn').onclick = () => {
      location.href = 'matariki.html';
    };

    // 🎄 Go to christmas.html on click
    document.getElementById('tree').onclick = () => {
      const isNew = unlockWithPopup('festive-find', 'Festive Find');
      window.setTimeout(() => { location.href = 'christmas.html'; }, isNew ? 2400 : 0);
    };

    // Settings button - open modal
    document.getElementById('settingsBtn').onclick = () => {
      document.getElementById('overlay').style.display = 'block';
      document.getElementById('settingsModal').style.display = 'block';
    };

    // Close settings modal
    document.querySelector('.closeSettings').onclick = () => {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('settingsModal').style.display = 'none';
    };

    // Overlay click to close
    document.getElementById('overlay').onclick = () => {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('settingsModal').style.display = 'none';
    };

    // UI Size button - pretends to adjust UI
    document.getElementById('uiSizeBtn').onclick = () => {
      alert('🤔 This feature is coming soon... maybe!');
    };

    // Useless button - rickroll
    document.getElementById('uselessBtn').onclick = () => {
      window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank');
    };

    // Theme button
    document.getElementById('themeBtn').onclick = () => {
      const body = document.body;
      const currentBg = body.style.background;
      
      if (!currentBg || currentBg === '' || currentBg.includes('255, 255, 255')) {
        body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        body.style.color = 'white';
      } else {
        body.style.background = '';
        body.style.color = '';
      }
      alert('🎨 Theme toggled!');
    };

    // Sound button
    document.getElementById('soundBtn').onclick = () => {
      alert('🔊 Sound effects coming soon! (Just kidding, there are none 😄)');
    };

    // Update revert button visibility
    function updateRevertButton() {
      const revertBtn = document.getElementById('revertBtn');
      if (isOGMode) {
        revertBtn.style.display = 'block';
      } else {
        revertBtn.style.display = 'none';
      }
    }

    // Password submit - Unlock OG Mode
    document.getElementById('submitPassword').onclick = () => {
      const password = document.getElementById('ogPassword').value;
      if (password === 'BANANA') {
        isOGMode = true;
        localStorage.setItem('ogMode', 'true');
        const secretUnlocked = unlockWithPopup('secret-identity', 'Secret Identity');
        
        // Change Hi to Welcome, OG user!
        document.getElementById('hi').textContent = 'Welcome, OG user!';
        updateRevertButton();
        
        // Close modal
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('settingsModal').style.display = 'none';
        
        window.setTimeout(() => {
          alert('🎉 OG Mode Activated! The text will stay as "Welcome, OG user!" every time you visit!');
        }, secretUnlocked ? 2400 : 0);
      } else {
        alert('❌ Wrong Password!');
      }
      document.getElementById('ogPassword').value = '';
    };

    // Allow Enter key to submit password
    document.getElementById('ogPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('submitPassword').click();
      }
    });

    // Revert button - back to "Hi"
    document.getElementById('revertBtn').onclick = () => {
      isOGMode = false;
      localStorage.setItem('ogMode', 'false');
      
      // Revert text to Hi
      document.getElementById('hi').textContent = 'Hi';
      updateRevertButton();
      
      // Close modal
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('settingsModal').style.display = 'none';
      
      alert('🔄 Reverted to normal "Hi" text!');
    };
  </script>
</body>
</html>
